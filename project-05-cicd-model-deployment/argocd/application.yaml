apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knat-llm-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Knat-LLM/knat-llm-gitops.git
    targetRevision: main
    path: apps/llm-server
  destination:
    server: https://kubernetes.default.svc
    namespace: knat-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
